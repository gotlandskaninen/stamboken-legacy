name: Frontend

on:
  push:
    branches: [production, test-prod]
  pull_request:
    branches: [production, test-prod]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Same image as stamboken's scripts/build-legacy.dockerfile
    container: node:24-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Install (no install scripts)
        run: npm ci --ignore-scripts --legacy-peer-deps && node node_modules/esbuild/install.js

      - name: Build
        run: PATH=node_modules/.bin:$PATH ./build.sh

      - name: No new type errors
        run: |
          ./tsc-errors > /tmp/tsc-errors.txt
          echo "tsc: $(wc -l < /tmp/tsc-errors.txt) errors in src/, baseline $(wc -l < tsc-baseline.txt)"
          new=$(LC_ALL=C comm -13 tsc-baseline.txt /tmp/tsc-errors.txt)
          if [ -n "$new" ]; then
            echo "New type errors (after fixing old ones: ./tsc-errors > tsc-baseline.txt):"
            echo "$new"
            exit 1
          fi

      - name: retire.js on the bundle
        run: npx --yes retire@6.1.0 --path dist

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: osv-scanner on the lockfile
        run: >
          docker run --rm -v "$PWD/frontend:/src:ro"
          ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --lockfile /src/package-lock.json --config /src/osv-scanner.toml
